<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Personal - Sergio's Hub</title>
    <style>
        :root { 
            --primary: #667eea; 
            --secondary: #764ba2; 
            --accent: #00f2fe;
            --dark-bg: #0f0c29; 
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, var(--dark-bg) 0%, #302b63 50%, #24243e 100%);
            color: white; 
            min-height: 100vh; 
            padding: 20px;
            overflow-x: hidden;
        }

        /* Fondo animado sutil */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* Header Estilo Arcade */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 50px; 
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        h1 { 
            font-size: 2.5rem; 
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent)); 
            -webkit-background-clip: text; 
            color: transparent; 
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
            letter-spacing: -1px;
        }

        .back-btn { 
            background: rgba(255,255,255,0.1); 
            color: white; 
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 24px; 
            border-radius: 50px; 
            cursor: pointer; 
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
        .back-btn:hover { 
            background: var(--primary); 
            border-color: var(--primary);
            transform: translateX(-5px); 
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* Grid de Juegos Mejorado */
        .games-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
            padding-bottom: 50px;
        }

        .game-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .game-card:hover { 
            transform: translateY(-10px) scale(1.02); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(102, 126, 234, 0.2); 
            border-color: var(--primary);
        }

        .game-thumb { 
            height: 180px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 5rem;
            background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1));
            position: relative;
            overflow: hidden;
        }

        /* Efecto de brillo en hover sobre la imagen */
        .game-card:hover .game-thumb::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shine 0.8s infinite;
        }

        @keyframes shine { to { left: 100%; } }

        .game-info { padding: 25px; }
        .game-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; color: white; }
        .game-desc { font-size: 0.95rem; color: #b0b0d0; margin-bottom: 20px; line-height: 1.5; }
        
        .play-btn { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(90deg, var(--primary), var(--secondary)); 
            color: white; 
            text-align: center; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 700;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .play-btn:hover { 
            filter: brightness(1.2); 
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }

        .score-badge { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: rgba(0,0,0,0.6); 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: 700;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--accent);
            z-index: 2;
        }

        /* Estado de carga */
        .loading { 
            grid-column: 1 / -1; 
            text-align: center; 
            padding: 80px; 
            color: #666; 
            font-size: 1.2rem;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary); border-radius: 50%;
            margin: 0 auto 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .games-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 20px; text-align: center; }
        }

        /* ===== Menú de categorías ===== */
        .cat-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 10px 0 20px;
            position: sticky;
            top: 8px;
            z-index: 50;
            padding: 10px;
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .cat-btn {
            padding: 9px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .cat-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
        .cat-btn.active {
            background: linear-gradient(90deg, var(--primary), #00f2fe);
            color: #04121f;
            border-color: transparent;
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.35);
        }
        .search-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 26px;
        }
        .search-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: var(--card-bg);
            color: white;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s;
        }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 12px rgba(102,126,234,.35); }
        .game-count { color: #b0b0d0; font-size: 0.85rem; white-space: nowrap; }
        .cat-label {
            grid-column: 1 / -1;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00f2fe;
            margin: 18px 0 -6px;
            text-shadow: 0 0 14px rgba(0,242,254,.4);
        }
        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: #b0b0d0;
            padding: 60px 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎮 ARCADE PERSONAL</h1>
        <a href="../index.html" class="back-btn">← Volver al Hub</a>
    </header>

    <nav class="cat-menu" id="catMenu">
        <button class="cat-btn active" data-cat="todos">🎮 Todos</button>
        <button class="cat-btn" data-cat="nuevos">✨ Novedades</button>
        <button class="cat-btn" data-cat="accion">💥 Acción</button>
        <button class="cat-btn" data-cat="reflejos">⚡ Reflejos</button>
        <button class="cat-btn" data-cat="mentes">🧠 Para Mentes</button>
        <button class="cat-btn" data-cat="caos">🤪 Caos Total</button>
        <button class="cat-btn" data-cat="clasicos">👴 Clásicos</button>
    </nav>

    <div class="search-row">
        <input type="text" id="buscador" class="search-input" placeholder="🔍 Buscar juego..." autocomplete="off">
        <span class="game-count" id="gameCount"></span>
    </div>

    <div id="games-container" class="games-grid">
        <div class="loading">
            <div class="spinner"></div>
            Cargando tus juegos y récords...
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBmTBMyE7Y_LgSXH1SrmEv29DLYdxkyUEw",
        authDomain: "compartir-textos-app.firebaseapp.com",
        projectId: "compartir-textos-app",
        storageBucket: "compartir-textos-app.firebasestorage.app",
        messagingSenderId: "705083380628",
        appId: "1:705083380628:web:ce267570e09e3ef1b27581"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Catálogo de juegos (Fácil de expandir)
    const gamesCatalog = [
        { id: 'snake', name: 'Snake Clásico', icon: '🐍', desc: 'El clásico juego de la serpiente. Come manzanas y no choques con tu cola.', file: 'snake.html' },
        { id: 'clicker', name: 'Super Clicker', icon: '💰', desc: 'Haz clic para ganar monedas y compra mejoras automáticas. ¡Adictivo!', file: 'clicker.html' },
        { id: 'memoria', name: 'Memoria Flash', icon: '🎴', desc: 'Encuentra todas las parejas de cartas en el menor tiempo posible.', file: 'memoria.html' },
        { id: 'tetris', name: 'Tetris Block', icon: '🧩', desc: 'Encaja las piezas geométricas antes de que lleguen arriba.', file: 'tetris.html' },
        { id: 'pong', name: 'Pong Retro', icon: '🏓', desc: 'Desafía a la IA en este clásico del tenis de mesa digital.', file: 'pong.html' },
        { id: 'wordle', name: 'Adivina Palabra', icon: '🤬', desc: 'Tienes 6 intentos para adivinar la palabra secreta del día.', file: 'wordle.html' },
        { id: 'sopas', name: 'Sopa de Letras Pro', icon: '🅿', desc: 'Encuentra palabras ocultas generadas dinámicamente por una IA de diccionario.', file: 'sopas.html' },
        { id: 'rata', name: 'Atrapa la Rata', icon: '🐀', desc: 'Tienes 30 segundos para atrapar tantas ratas como puedas. ¡Corren por todo el tablero!', file: 'rata.html' },
        { id: 'rompebricks', name: 'Rompe Ladrillos', icon: '🧱', desc: 'Clásico Breakout con ladrillos neón, partículas y niveles infinitos. ¡No dejes caer la bola!', file: 'rompebricks.html' },
        { id: 'flappy', name: 'Flappy Sergio', icon: '🐤', desc: 'Un clic para aletear. Simpático, colorido... y brutalmente difícil. ¿Cuántos tubos aguantas?', file: 'flappy.html' },
        { id: 'simon', name: 'Memoria Lumínica', icon: '🌈', desc: 'Simon Says con sonidos reales: repite la secuencia de colores antes de que tu memoria falle.', file: 'simon.html' },
        { id: 'dosmilcuarenta', name: '2048 Neón', icon: '🔢', desc: 'Desliza y fusiona números hasta llegar a la legendaria casilla 2048 brillante.', file: 'dosmilcuarenta.html' },
        { id: 'asteroides', name: 'Asteroides', icon: '☄️', desc: 'Pilota tu nave, esquiva y destroza asteroides que se dividen al recibir impactos.', file: 'asteroides.html' },
        { id: 'minas', name: 'Buscaminas Neón', icon: '💣', desc: 'El clásico destapador de casillas con 3 dificultades y cronómetro. ¿Suerte o lógica?', file: 'minas.html' },
        { id: 'reflejo', name: 'Reflejo de Colores', icon: '🎨', desc: 'Prueba de Stroop pura adrenalina: responde al COLOR de la palabra, no a lo que dice.', file: 'reflejo.html' },
        { id: 'reaccion', name: 'Test de Reacción', icon: '⚡', desc: '¿Cuánto tardas en reaccionar? Mide tus reflejos en milisegundos y compite contra ti mismo.', file: 'reaccion.html' },
    ];

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = '../index.html';
            return;
        }
        currentUser = user;
        await renderGames();
    });

    async function renderGames() {
        const container = document.getElementById('games-container');
        container.innerHTML = '';

        // Obtener récords del usuario actual
        const scoresMap = {};
        try {
            const q = query(collection(db, "scores"), where("userId", "==", currentUser.uid));
            const snapshot = await getDocs(q);
            snapshot.forEach(doc => {
                const data = doc.data();
                // Guardar solo la puntuación más alta por juego
                if (!scoresMap[data.gameId] || data.score > scoresMap[data.gameId]) {
                    scoresMap[data.gameId] = data.score;
                }
            });
        } catch (e) { console.log("No hay récords aún"); }

        // Generar tarjetas con animación escalonada
        gamesCatalog.forEach((game, index) => {
            const highScore = scoresMap[game.id] || 0;
            const scoreText = highScore > 0 ? `🏆 ${highScore.toLocaleString()}` : 'Sin récord';
            
            const card = document.createElement('div');
            card.className = 'game-card';
            card.style.animation = `fadeInUp 0.5s ease forwards ${index * 0.1}s`;
            card.style.opacity = '0'; // Inicialmente invisible para la animación
            
            card.innerHTML = `
                <div class="score-badge">${scoreText}</div>
                <div class="game-thumb">${game.icon}</div>
                <div class="game-info">
                    <div class="game-title">${game.name}</div>
                    <div class="game-desc">${game.desc}</div>
                    <a href="${game.file}" class="play-btn">▶ JUGAR AHORA</a>
                </div>
            `;
            container.appendChild(card);
        });

        // Añadir keyframes dinámicamente para la animación de entrada
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(30px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(styleSheet);
    }
</script>
</body>
</html>
