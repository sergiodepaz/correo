<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Personal - Sergio's Hub</title>
    <style>
        :root { 
            --primary: #667eea; 
            --secondary: #764ba2; 
            --accent: #00f2fe;
            --dark-bg: #0f0c29; 
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, var(--dark-bg) 0%, #302b63 50%, #24243e 100%);
            color: white; 
            min-height: 100vh; 
            padding: 20px;
            overflow-x: hidden;
        }

        /* Fondo animado sutil */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* Header Estilo Arcade */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 50px; 
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        h1 { 
            font-size: 2.5rem; 
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent)); 
            -webkit-background-clip: text; 
            color: transparent; 
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
            letter-spacing: -1px;
        }

        .back-btn { 
            background: rgba(255,255,255,0.1); 
            color: white; 
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 24px; 
            border-radius: 50px; 
            cursor: pointer; 
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
        .back-btn:hover { 
            background: var(--primary); 
            border-color: var(--primary);
            transform: translateX(-5px); 
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* Grid de Juegos Mejorado */
        .games-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
            padding-bottom: 50px;
        }

        .game-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .game-card:hover { 
            transform: translateY(-10px) scale(1.02); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(102, 126, 234, 0.2); 
            border-color: var(--primary);
        }

        .game-thumb { 
            height: 180px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 5rem;
            background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1));
            position: relative;
            overflow: hidden;
        }

        /* Efecto de brillo en hover sobre la imagen */
        .game-card:hover .game-thumb::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shine 0.8s infinite;
        }

        @keyframes shine { to { left: 100%; } }

        .game-info { padding: 25px; }
        .game-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; color: white; }
        .game-desc { font-size: 0.95rem; color: #b0b0d0; margin-bottom: 20px; line-height: 1.5; }
        
        .play-btn { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(90deg, var(--primary), var(--secondary)); 
            color: white; 
            text-align: center; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 700;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .play-btn:hover { 
            filter: brightness(1.2); 
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }

        .score-badge { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: rgba(0,0,0,0.6); 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: 700;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--accent);
            z-index: 2;
        }

        /* Estado de carga */
        .loading { 
            grid-column: 1 / -1; 
            text-align: center; 
            padding: 80px; 
            color: #666; 
            font-size: 1.2rem;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary); border-radius: 50%;
            margin: 0 auto 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .games-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 20px; text-align: center; }
        }

        /* ===== Menú de categorías ===== */
        .cat-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 10px 0 20px;
            position: sticky;
            top: 8px;
            z-index: 50;
            padding: 10px;
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .cat-btn {
            padding: 9px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .cat-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
        .cat-btn.active {
            background: linear-gradient(90deg, var(--primary), #00f2fe);
            color: #04121f;
            border-color: transparent;
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.35);
        }
        .search-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 26px;
        }
        .search-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: var(--card-bg);
            color: white;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s;
        }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 12px rgba(102,126,234,.35); }
        .game-count { color: #b0b0d0; font-size: 0.85rem; white-space: nowrap; }
        .cat-label {
            grid-column: 1 / -1;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00f2fe;
            margin: 18px 0 -6px;
            text-shadow: 0 0 14px rgba(0,242,254,.4);
        }
        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: #b0b0d0;
            padding: 60px 0;
            font-size: 1.1rem;
        }

        /* ===== Tarjetas ocultables (menú + búsqueda) ===== */
        .game-card.hidden-card { display: none; }
        .cat-chip {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.55);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.12);
            z-index: 2;
        }
    </style>
</head>

    const firebaseConfig = {

    // Catálogo de juegos (Fácil de expandir)
    const gamesCatalog = [

        { id: 'flappy', name: 'Flappy Sergio', icon: '🐤', desc: 'Un clic para aletear. Simpático, colorido... y brutalmente difícil. ¿Cuántos tubos aguantas?', file: 'flappy.html' , cats: ['reflejos','accion'] },
        { id: 'simon', name: 'Memoria Lumínica', icon: '🌈', desc: 'Simon Says con sonidos reales: repite la secuencia de colores antes de que tu memoria falle.', file: 'simon.html' , cats: ['mentes'] },
        { id: 'dosmilcuarenta', name: '2048 Neón', icon: '🔢', desc: 'Desliza y fusiona números hasta llegar a la legendaria casilla 2048 brillante.', file: 'dosmilcuarenta.html' , cats: ['mentes'] },
        { id: 'pacman', name: 'Pac-Man Neón', icon: '🟡', desc: 'Come todos los puntos del laberinto sin que te cacen los fantasmas. ¡Las píldoras te dan ventaja!', file: 'pacman.html' , cats: ['clasicos','accion'] },
        { id: 'minas', name: 'Buscaminas Neón', icon: '💣', desc: 'El clásico destapador de casillas con 3 dificultades y cronómetro. ¿Suerte o lógica?', file: 'minas.html' , cats: ['mentes'] },
        { id: 'reflejo', name: 'Reflejo de Colores', icon: '🎨', desc: 'Prueba de Stroop pura adrenalina: responde al COLOR de la palabra, no a lo que dice.', file: 'reflejo.html' , cats: ['reflejos'] },
        { id: 'reaccion', name: 'Test de Reacción', icon: '⚡', desc: '¿Cuánto tardas en reaccionar? Mide tus reflejos en milisegundos y compite contra ti mismo.', file: 'reaccion.html' , cats: ['reflejos'] },
        { id: 'punteria', name: 'Puntería Extrema', icon: '🎯', desc: '30 segundos, dianas que aparecen y desaparecen. Dispara al centro para sumar más puntos.', file: 'punteria.html' , cats: ['reflejos','nuevos'] },
        { id: 'memorianum', name: 'Memoria Numérica', icon: '🔢', desc: 'Memoriza la secuencia de números antes de que desaparezca y escríbela. Cada nivel añade un dígito.', file: 'memorianum.html' , cats: ['mentes','nuevos'] },
        { id: 'objeto', name: 'Objeto Escondido', icon: '🕵️', desc: 'Encuentra el emoji buscado entre decenas de señuelos... algunos se camuflan en el fondo.', file: 'objeto.html' , cats: ['reflejos','nuevos'] },
        { id: 'run', name: 'Carrera Infinita', icon: '🏃', desc: 'Corre sin parar, salta obstáculos y aguanta los metros que puedas. ¡La velocidad no perdona!', file: 'run.html' , cats: ['reflejos','accion'] },
        { id: 'galaxia', name: 'Galaxia Sergio', icon: '🚀', desc: 'Defiende la galaxia de oleadas de enemigos. Potencia tu nave y bate tu récord estelar.', file: 'galaxia.html' , cats: ['accion'] },
        { id: 'pongneon', name: 'Pong Neón', icon: '🌌', desc: 'La versión más brillante del clásico Pong: efectos neón, velocidad creciente y pura tensión.', file: 'pongneon.html' , cats: ['reflejos','clasicos'] },
        { id: 'whack', name: 'Whack-a-Mole', icon: '🔨', desc: 'Mazos a tiempo: golpea a los topillos antes de que vuelvan a esconderse. ¡Reflejos al límite!', file: 'whack.html' , cats: ['reflejos','caos'] },
        { id: 'topillos', name: 'Los Topillos', icon: '🐹', desc: 'La variante arcade de golpear topillos con combos y penalizaciones. ¿Cuántos atrapas?', file: 'topillos.html' , cats: ['reflejos','caos'] },
        { id: 'bubblepop', name: 'Explota Todo', icon: '🫧', desc: 'Une y revienta burbujas de colores antes de que la pantalla se llene. ¡Puras explosiones!', file: 'bubblepop.html' , cats: ['caos','reflejos'] },
        { id: 'colorrush', name: 'Color Rush', icon: '🌈', desc: 'A todo color: decide rápido si el nombre y el color coinciden. Cada error cuenta.', file: 'colorrush.html' , cats: ['reflejos','caos'] },
        { id: 'cuatro', name: 'Conecta 4 Loco', icon: '🔴', desc: 'El clásico Connect Four contra una IA traviesa. Alinea cuatro fichas para ganar.', file: 'cuatro.html' , cats: ['mentes','clasicos'] },
        { id: 'matagato', name: 'Mate al Gato', icon: '🐱', desc: 'Versión turbo del tres en línea: vence a la IA antes de que el gato te venza a ti.', file: 'matagato.html' , cats: ['mentes','clasicos'] },
        { id: 'reinas', name: '8 Reinas Locas', icon: '👑', desc: 'Coloca 8 reinas en el tablero sin que se ataquen entre sí. Pura lógica ajedrecística.', file: 'reinas.html' , cats: ['mentes'] },
        { id: 'sudoku', name: 'Sudoku Neón', icon: '🧮', desc: 'Rellena la rejilla respetando filas, columnas y bloques. Con pistas y estilo neón.', file: 'sudoku.html' , cats: ['mentes'] },
        { id: 'memoji', name: 'MEMOJI', icon: '🧠', desc: 'Memoriza emojis en pantalla y recuérdalos todos. Tu memoria puesta a prueba.', file: 'memoji.html' , cats: ['mentes','nuevos'] },

        // ⚽ ZONA FÚTBOL
        { id: 'penaltis', name: 'Penaltis NeonFOOT', icon: '🥅', desc: '5 penaltis, 3 porteros con estilos distintos y marcador de estadio. ¡Tira con efecto!', file: 'penaltis.html' , cats: ['deportes','reflejos','nuevos'] },
        { id: 'futlaberinto', name: 'Laberinto del Fútbol', icon: '🏟️', desc: 'Guía el balón por el laberinto hasta la portería esquivando defensas. Con niveles infinitos.', file: 'futlaberinto.html' , cats: ['deportes','mentes','nuevos'] },
        { id: 'quiniela', name: 'Quiniela Express', icon: '📋', desc: 'Acierta el resultado (1/X/2) de cada partido usando las estadísticas. ¿Cuántas jornadas aguantas?', file: 'quiniela.html' , cats: ['deportes','mentes','nuevos'] },
        { id: 'regate', name: 'Regate Infinito', icon: '⛹️', desc: 'Conduce el balón esquivando defensas que caen sobre el campo. Cada regate suma puntos.', file: 'regate.html' , cats: ['deportes','reflejos','accion','nuevos'] },

        // 🆕 Otros juegos nuevos
        { id: 'memecolor', name: 'Memoria de Colores', icon: '🎨', desc: 'Memoriza la rejilla de colores antes de que se apague y reprodúcela exacta. Niveles crecientes.', file: 'memecolor.html' , cats: ['mentes','nuevos'] },
        { id: 'velocidadtc', name: 'Velocidad de Teclado', icon: '⌨️', desc: 'Escribe las frases que aparecen lo más rápido posible. Mide tus palabras por minuto.', file: 'velocidadtc.html' , cats: ['reflejos','nuevos'] },
    ];

    let currentUser = null;
    let activeCat = 'todos';   // Categoría seleccionada en el menú
    let searchTerm = '';        // Texto del buscador

    // Metadatos de categorías (para etiquetas y contadores del menú)
    const catMeta = {
        nuevos:   { label: '✨ Novedades' },
        accion:   { label: '💥 Acción' },
        reflejos: { label: '⚡ Reflejos' },
        mentes:   { label: '🧠 Para Mentes' },
        deportes: { label: '⚽ Deportes' },
        caos:     { label: '🤪 Caos Total' },
        clasicos: { label: '👴 Clásicos' },
    };

    // Récords locales (inmediatos, sin esperar a la nube) por si el usuario
    // juega en este dispositivo con arcade-lib.js
    function localRecords() {
        const uid = localStorage.getItem('arcade_uid');
        uid && localStorage.setItem('arcade_uid_last', uid); // último uid conocido
        const lookupUid = uid || localStorage.getItem('arcade_uid_last');
        const map = {};
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (!k || !k.startsWith('rec_')) continue;
                if (lookupUid && !(k === 'rec_' + lookupUid || k.startsWith('rec_' + lookupUid + '_'))) continue;
                const gid = k.replace(/^rec_(?:anon|[A-Za-z0-9_-]+?)_/, '');
                const v = +(JSON.parse(localStorage.getItem(k)) || 0);
                if (gid && v > (map[gid] || 0)) map[gid] = v;
            }
        } catch (e) {}
        return map;
    }

    // Normaliza texto: minúsculas y sin tildes (buscar "memoria" encuentra "Memoria Flash")
    const normalize = str => (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = '../index.html';
            return;
        }
        currentUser = user;
        // 1) Pintar las tarjetas YA (catálogo local + récords locales): carga instantánea
        renderGames(localRecords());
        setupMenuAndSearch();
        // 2) En segundo plano, traer los récords de la nube y actualizar solo las insignias
        fetchCloudScores();
    });

    async function fetchCloudScores() {
        const scoresMap = {};
        try {
            const q = query(collection(db, "scores"), where("userId", "==", currentUser.uid));
            const snapshot = await getDocs(q);
            snapshot.forEach(doc => {
                const data = doc.data();
                if (!scoresMap[data.gameId] || data.score > scoresMap[data.gameId]) {
                    scoresMap[data.gameId] = data.score;
                }
            });
        } catch (e) { console.log("No hay récords aún"); }
        updateScoreBadges(scoresMap);
    }

    // Actualiza únicamente las insignias 🏆 sin re-pintar el grid (rápido)
    function updateScoreBadges(scoresMap) {
        document.querySelectorAll('#games-container .game-card').forEach(card => {
            const id = card.dataset.id;
            const badge = card.querySelector('.score-badge');
            if (!badge || !id) return;
            const key = 'rec_' + (currentUser ? currentUser.uid : 'anon') + '_' + id;
            const localRaw = localStorage.getItem(key);
            const best = Math.max(scoresMap[id] || 0, +(localRaw ? localRaw.replace(/"/g, '') : 0) || 0);
            badge.textContent = best > 0 ? `🏆 ${best.toLocaleString()}` : 'Sin récord';
        });
    }

    function renderGames(scoresMap) {
        const container = document.getElementById('games-container');
        container.innerHTML = '';

        // Mensaje de resultados vacíos (búsqueda sin coincidencias)
        const emptyMsg = document.createElement('div');
        emptyMsg.className = 'empty-msg';
        emptyMsg.id = 'emptyMsg';
        emptyMsg.style.display = 'none';
        emptyMsg.textContent = '😶 No se encontró ningún juego con esa búsqueda.';

        // Generar tarjetas con animación escalonada
        gamesCatalog.forEach((game, index) => {
            const highScore = scoresMap[game.id] || 0;
            const scoreText = highScore > 0 ? `🏆 ${highScore.toLocaleString()}` : 'Sin récord';

            const primaryCat = game.cats && game.cats.length ? game.cats[0] : null;
            const chipHtml = primaryCat ? `<div class="cat-chip">${catMeta[primaryCat].label}</div>` : '';

            const card = document.createElement('div');
            card.className = 'game-card';
            card.dataset.id = game.id;
            card.dataset.cat = (game.cats || []).join(',');
            card.dataset.search = normalize(`${game.name} ${game.desc} ${game.id}`);
            card.style.animation = `fadeInUp 0.5s ease forwards ${Math.min(index, 12) * 0.05}s`;
            card.style.opacity = '0'; // Inicialmente invisible para la animación

            card.innerHTML = `
                ${chipHtml}
                <div class="score-badge">${scoreText}</div>
                <div class="game-thumb">${game.icon}</div>
                <div class="game-info">
                    <div class="game-title">${game.name}</div>
                    <div class="game-desc">${game.desc}</div>
                    <a href="${game.file}" class="play-btn">▶ JUGAR AHORA</a>
                </div>
            `;
            container.appendChild(card);
        });

        container.appendChild(emptyMsg);
        applyFilters();

        // Añadir keyframes dinámicamente para la animación de entrada
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(30px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(styleSheet);
    }

    // ===== Menú de categorías + búsqueda =====
    function setupMenuAndSearch() {
        const menu = document.getElementById('catMenu');
        const buscador = document.getElementById('buscador');

        // Contador de juegos por categoría en cada botón del menú
        menu.querySelectorAll('.cat-btn').forEach(btn => {
            const cat = btn.dataset.cat;
            const count = cat === 'todos'
                ? gamesCatalog.length
                : gamesCatalog.filter(g => (g.cats || []).includes(cat)).length;
            btn.textContent = `${btn.textContent} (${count})`;
            btn.setAttribute('aria-pressed', btn.classList.contains('active') ? 'true' : 'false');
        });

        // Clic + navegación por teclado entre botones (← → Inicio Fin)
        const buttons = Array.from(menu.querySelectorAll('.cat-btn'));
        buttons.forEach((btn, i) => {
            btn.addEventListener('click', () => selectCat(btn));
            btn.addEventListener('keydown', e => {
                let k = null;
                if (e.key === 'ArrowRight') k = (i + 1) % buttons.length;
                else if (e.key === 'ArrowLeft') k = (i - 1 + buttons.length) % buttons.length;
                else if (e.key === 'Home') k = 0;
                else if (e.key === 'End') k = buttons.length - 1;
                if (k !== null) { e.preventDefault(); buttons[k].focus(); buttons[k].click(); }
            });
        });

        // Búsqueda en vivo (nombre, descripción e id; sin distinguir mayúsculas ni tildes)
        buscador.addEventListener('input', () => {
            searchTerm = normalize(buscador.value.trim());
            applyFilters();
        });
        // Escape limpia la búsqueda
        buscador.addEventListener('keydown', e => {
            if (e.key === 'Escape') { buscador.value = ''; searchTerm = ''; applyFilters(); }
        });
    }

    function selectCat(btn) {
        activeCat = btn.dataset.cat;
        document.querySelectorAll('#catMenu .cat-btn').forEach(b => {
            const isActive = b === btn;
            b.classList.toggle('active', isActive);
            b.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
        applyFilters();
    }

    function applyFilters() {
        const cards = document.querySelectorAll('#games-container .game-card');
        let visible = 0;
        cards.forEach(card => {
            const cats = card.dataset.cat ? card.dataset.cat.split(',') : [];
            const matchCat = activeCat === 'todos' || cats.includes(activeCat);
            const matchSearch = !searchTerm || card.dataset.search.includes(searchTerm);
            const show = matchCat && matchSearch;
            card.classList.toggle('hidden-card', !show);
            if (show) visible++;
        });

        const counter = document.getElementById('gameCount');
        if (counter) {
            counter.textContent = (activeCat === 'todos' && !searchTerm)
                ? `${visible} juegos`
                : `${visible} de ${cards.length} juegos`;
        }

        const empty = document.getElementById('emptyMsg');
        if (empty) empty.style.display = visible === 0 ? '' : 'none';
    }
</script>
