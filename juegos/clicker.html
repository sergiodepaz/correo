<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Clicker - Sergio's Arcade</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .coin-btn { width: 200px; height: 200px; border-radius: 50%; background: linear-gradient(135deg, #ffd700, #ffaa00); border: none; font-size: 4rem; cursor: pointer; box-shadow: 0 0 30px rgba(255,215,0,0.4); transition: transform 0.1s; margin: 30px 0; }
        .coin-btn:active { transform: scale(0.95); }
        .stats { font-size: 2rem; font-weight: bold; color: #ffd700; margin-bottom: 10px; }
        .upgrades { display: grid; gap: 10px; max-width: 400px; margin: 0 auto; }
        .upgrade { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        .upgrade:hover { border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .upgrade.disabled { opacity: 0.5; cursor: not-allowed; }
        a { color: #aaa; text-decoration: none; margin-top: 30px; display: inline-block; }
    </style>
</head>
<body>
    <div class="stats"> <span id="coins">0</span></div>
    <div style="color:#aaa; margin-bottom:20px;">Monedas por segundo: <span id="cps">0</span></div>
    
    <button class="coin-btn" onclick="clickCoin()">💰</button>

    <div class="upgrades">
        <div class="upgrade" id="upg1" onclick="buyUpgrade(1)">
            <strong>Cursor Mágico (+1/s)</strong><br>Coste: <span id="cost1">15</span> 
        </div>
        <div class="upgrade" id="upg2" onclick="buyUpgrade(2)">
            <strong>Mina de Oro (+5/s)</strong><br>Coste: <span id="cost2">100</span> 🪙
        </div>
        <div class="upgrade" id="upg3" onclick="buyUpgrade(3)">
            <strong>Fábrica de Monedas (+20/s)</strong><br>Coste: <span id="cost3">500</span> 
        </div>
    </div>

    <a href="juegos.html">← Volver al Menú</a>

    <script src="arcade-lib.js"></script>
    <script>

        let coins = +(localStorage.getItem('clicker_coins') || 0);   // tu partida se conserva al volver
        let cps = 0;
        let costs = [15, 100, 500];
        let cpsValues = [1, 5, 20];

        window.clickCoin = function(ev) {
            coins++;
            floatText(ev, '+1');
            Arcade.beep(500 + Math.random()*150, .03, 'square', .04);
            updateUI();
        }

        // pequeño "+1" flotante donde haces clic
        function floatText(ev, txt) {
            const el = document.createElement('div');
            el.textContent = txt;
            el.style.cssText = 'position:fixed;color:#ffd700;font-weight:800;font-size:1.3rem;pointer-events:none;z-index:999;' +
              'text-shadow:0 0 8px rgba(255,215,0,.6);transition:all .7s ease-out;left:' + (ev.clientX||innerWidth/2) + 'px;top:' + (ev.clientY||0) + 'px;opacity:1;';
            document.body.appendChild(el);
            requestAnimationFrame(() => { el.style.transform = 'translateY(-60px)'; el.style.opacity = '0'; });
            setTimeout(() => el.remove(), 750);
        }

        window.buyUpgrade = function(idx) {
            if(coins >= costs[idx]) {
                coins -= costs[idx];
                cps += cpsValues[idx];
                costs[idx] = Math.floor(costs[idx] * 1.5);
                Arcade.beep(700 + idx*200, .08, 'triangle', .1);
                save();
                updateUI();
            } else {
                Arcade.beep(150, .12, 'sawtooth', .08);
                Arcade.toast('Te faltan ' + Math.ceil(costs[idx] - coins) + ' monedas 💰');
            }
        }

        function save() {
            localStorage.setItem('clicker_coins', String(Math.floor(coins)));
            localStorage.setItem('clicker_cps', String(cps));
            localStorage.setItem('clicker_costs', JSON.stringify(costs));
        }

        // restaurar mejoras guardadas
        try {
            const sc = JSON.parse(localStorage.getItem('clicker_costs') || 'null');
            if (sc && sc.length === 3) { costs = sc; cps = +(localStorage.getItem('clicker_cps') || 0); }
        } catch(e) {}

        function updateUI() {
            document.getElementById('coins').innerText = Math.floor(coins);
            document.getElementById('cps').innerText = cps;
            for(let i=0; i<3; i++) {
                document.getElementById(`cost${i+1}`).innerText = costs[i];
                document.getElementById(`upg${i+1}`).className = coins >= costs[i] ? 'upgrade' : 'upgrade disabled';
            }
        }

        setInterval(() => {
            if(cps > 0) {
                coins += cps / 10;
                updateUI();
            }
        }, 100);

        // Guardar progreso y récord (la librería evita duplicados en la nube)
        setInterval(() => {
            save();
            if (coins > 0) Arcade.addScore(Math.floor(coins));
        }, 15000);
        window.addEventListener('beforeunload', save);
        updateUI();
    </script>
</body>
</html>
