<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Adivina Palabra - Sergio's Arcade</title>
    <style>
        body { background: #0f0c29; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        h1 { color: #00f2fe; margin-bottom: 10px; }
        .status { color: #aaa; margin-bottom: 20px; height: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(5, 60px); gap: 8px; justify-content: center; margin-bottom: 30px; }
        .tile { 
            width: 60px; height: 60px; border: 2px solid #333; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 2rem; font-weight: bold; text-transform: uppercase; 
            transition: 0.3s;
        }
        .tile.correct { background: #4caf50; border-color: #4caf50; }
        .tile.present { background: #ffc107; border-color: #ffc107; color: black; }
        .tile.absent { background: #333; border-color: #333; }
        .tile.active { border-color: #667eea; animation: pop 0.1s; }
        
        @keyframes pop { 50% { transform: scale(1.1); } }

        .keyboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 500px; margin: 0 auto; }
        .key { 
            padding: 15px; min-width: 40px; background: #2a2a4e; 
            border-radius: 6px; cursor: pointer; font-weight: bold; user-select: none;
        }
        .key:hover { background: #3a3a6e; }
        
        a { color: #aaa; text-decoration: none; margin-top: 30px; display: inline-block; }
    </style>
</head>
<body>
    <h1>Adivina la Palabra</h1>
    <div class="status" id="status">Cargando palabra...</div>
    
    <div class="grid" id="grid"></div>
    <div class="keyboard" id="keyboard"></div>
    
    <a href="juegos.html">← Volver al Menú</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBmTBMyE7Y_LgSXH1SrmEv29DLYdxkyUEw", authDomain: "compartir-textos-app.firebaseapp.com", projectId: "compartir-textos-app", storageBucket: "compartir-textos-app.firebasestorage.app", messagingSenderId: "705083380628", appId: "1:705083380628:web:ce267570e09e3ef1b27581" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;
        onAuthStateChanged(auth, (user) => { if(user) currentUser = user; else window.location.href = '../index.html'; });

        let targetWord = "", currentRow = 0, currentTile = 0, gameOver = false;
        const rows = 6, cols = 5;
        const grid = document.getElementById('grid');
        const keyboard = document.getElementById('keyboard');
        
        // Teclado virtual
        const keys = "QWERTYUIOPASDFGHJKLÑZXCVBNM".split('');
        keys.forEach(k => {
            const key = document.createElement('div');
            key.className = 'key';
            key.innerText = k;
            key.onclick = () => handleInput(k);
            keyboard.appendChild(key);
        });
        // Botón borrar
        const backspace = document.createElement('div');
        backspace.className = 'key';
        backspace.innerText = '⌫';
        backspace.style.gridColumn = "span 2";
        backspace.onclick = () => handleInput('BACKSPACE');
        keyboard.appendChild(backspace);

        // Inicializar grid
        for(let i=0; i<rows*cols; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            grid.appendChild(tile);
        }

        async function initGame() {
            try {
                const res = await fetch("https://api.diccionarios.asmadrid.org/api/v1/words?length=5&limit=100&random=true");
                const data = await res.json();
                const candidates = data.words.map(w => w.word.toUpperCase()).filter(w => /^[A-ZÑ]+$/.test(w));
                targetWord = candidates[Math.floor(Math.random() * candidates.length)] || "SERGIO";
            } catch(e) {
                targetWord = "JUEGO";
            }
            document.getElementById('status').innerText = `Intento ${currentRow + 1} de ${rows}`;
            console.log("Palabra objetivo:", targetWord); // Para debug
        }

        function handleInput(key) {
            if(gameOver) return;
            const tiles = document.querySelectorAll('.tile');
            
            if(key === 'BACKSPACE') {
                if(currentTile > 0) {
                    currentTile--;
                    tiles[currentRow * cols + currentTile].innerText = '';
                    tiles[currentRow * cols + currentTile].classList.remove('active');
                }
            } else if(currentTile < cols) {
                tiles[currentRow * cols + currentTile].innerText = key;
                tiles[currentRow * cols + currentTile].classList.add('active');
                currentTile++;
            }

            if(currentTile === cols) checkRow();
        }

        function checkRow() {
            const tiles = document.querySelectorAll('.tile');
            const rowStart = currentRow * cols;
            const guess = Array.from({length: cols}, (_, i) => tiles[rowStart + i].innerText).join('');
            
            // Verificar colores
            const targetArr = targetWord.split('');
            const guessArr = guess.split('');
            const result = Array(cols).fill('absent');
            
            // Primero marcar correctos (verdes)
            for(let i=0; i<cols; i++) {
                if(guessArr[i] === targetArr[i]) {
                    result[i] = 'correct';
                    targetArr[i] = null; 
                    guessArr[i] = null;
                }
            }
            // Luego marcar presentes (amarillos)
            for(let i=0; i<cols; i++) {
                if(guessArr[i] && targetArr.includes(guessArr[i])) {
                    result[i] = 'present';
                    targetArr[targetArr.indexOf(guessArr[i])] = null;
                }
            }

            // Aplicar clases y actualizar teclado
            for(let i=0; i<cols; i++) {
                const tile = tiles[rowStart + i];
                tile.classList.remove('active');
                tile.classList.add(result[i]);
                
                // Actualizar teclado
                const keyDiv = Array.from(keyboard.children).find(k => k.innerText === guess.split('')[i]);
                if(keyDiv) {
                    if(result[i] === 'correct') keyDiv.style.background = '#4caf50';
                    else if(result[i] === 'present' && keyDiv.style.background !== '#4caf50') keyDiv.style.background = '#ffc107';
                    else if(result[i] === 'absent' && !['#4caf50','#ffc107'].includes(keyDiv.style.background)) keyDiv.style.background = '#333';
                }
            }

            if(guess === targetWord) {
                document.getElementById('status').innerText = "¡GANASTE! 🎉";
                gameOver = true;
                saveScore();
            } else if(currentRow === rows - 1) {
                document.getElementById('status').innerText = `Perdiste. Era: ${targetWord}`;
                gameOver = true;
            } else {
                currentRow++;
                currentTile = 0;
                document.getElementById('status').innerText = `Intento ${currentRow + 1} de ${rows}`;
            }
        }

        async function saveScore() {
            if(currentUser) {
                const score = (6 - currentRow) * 100;
                await addDoc(collection(db, "scores"), { userId: currentUser.uid, gameId: 'wordle', score, timestamp: new Date() });
            }
        }

        // Soporte teclado físico
        document.addEventListener('keydown', e => {
            const key = e.key.toUpperCase();
            if(keys.includes(key)) handleInput(key);
            if(e.key === 'Backspace') handleInput('BACKSPACE');
            if(e.key === 'Enter' && currentTile === cols) checkRow();
        });

        initGame();
    </script>
</body>
</html>
