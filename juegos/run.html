<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrera Infinita - Sergio's Arcade</title>
<link rel="stylesheet" href="arcade.css">
<style>
  #gc { position:relative; }
  canvas { display:block; }
  .overlay { background:rgba(15,12,41,.85); border-radius:14px; backdrop-filter:blur(6px); z-index:5; }
  .keys { margin-top:12px; color:var(--muted); font-size:.9rem; text-align:center; line-height:1.6; }
  kbd { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); border-bottom-width:3px; border-radius:6px; padding:2px 8px; font-weight:700; color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>🏃 Metro<b id="dist">0</b></span><span>💎 Gemas<b id="gems">0</b></span><span>❤️ Vidas<b id="lives">3</b></span><span>🏆 Récord<b id="best">—</b></span></div>
  <div id="gc">
    <canvas id="cv" width="760" height="380"></canvas>
    <div class="overlay" id="ovStart">
      <h2>🏃 CARRERA INFINITA</h2>
      <p>Corre sin parar, salta obstáculos (doble salto incluido) y recoge gemas. Cada 100 m va más rápido. ¡3 vidas!</p>
      <button class="btn-neon" id="btnStart">▶ CORRER</button>
    </div>
    <div class="overlay" id="ovEnd" style="display:none">
      <h2 id="endTitle">💀 ¡ACHICHADO!</h2>
      <p id="endMsg"></p>
      <button class="btn-neon" id="btnAgain">🔄 OTRA VUELTA</button>
    </div>
  </div>
  <div class="keys"><kbd>Espacio</kbd> / <kbd>↑</kbd> saltar (doble salto en el aire) · Toca la pantalla en móvil</div>
  <a href="juegos.html" class="back">← Volver al catálogo</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmTBMyE7Y_LgSXH1SrmEv29DLYdxkyUEw",
  authDomain: "compartir-textos-app.firebaseapp.com",
  projectId: "compartir-textos-app",
  storageBucket: "compartir-textos-app.firebasestorage.app",
  messagingSenderId: "705083380628",
  appId: "1:705083380628:web:ce267570e09e3ef1b27581"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;
const GAME_ID='run';

let AC=null;
function beep(f,d=.08,type='square',v=.12){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){} }

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=760,H=380,GROUND=H-50;
const $=id=>document.getElementById(id);

const OB=[ // obstáculos con emoji
  {e:'🌵',w:40,h:52,yOff:0},
  {e:'🪨',w:48,h:38,yOff:0},
  {e:'🦖',w:56,h:52,yOff:0},
  {e:'🔥',w:44,h:44,yOff:0},
  {e:'🛸',w:56,h:34,yOff:-70}, // volador: hay que NO saltar o saltar bajo
];

let player, obs, gemsArr, clouds, speed, dist, gems, lives, running=false, invT=0, lastTs=0, spawnT=0, gemT=0, stars=[];
for(let i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*(GROUND-80),r:Math.random()*1.6+.4});

function reset(){
  player={x:90,y:GROUND-56,vy:0,jumps:0,w:44,h:56};
  obs=[]; gemsArr=[]; clouds=[{x:100,y:60},{x:400,y:100},{x:650,y:50}];
  speed=280; dist=0; gems=0; lives=3; invT=0; spawnT=1.2; gemT=2;
  updHud();
}

async function loadBest(){ if(!currentUser)return; try{
  const snap=await getDocs(query(collection(db,"scores"),where("userId","==",currentUser.uid),where("gameId","==",GAME_ID)));
  let b=0; snap.forEach(d=>b=Math.max(b,d.data().score)); $('best').innerText=b+' m'||'—';
}catch(e){} }

function updHud(){ $('dist').innerText=dist|0; $('gems').innerText=gems; $('lives').innerText=lives; }

function jump(){
  if(!running)return;
  if(player.jumps<2){
    player.vy = player.jumps===0? -620 : -520;
    player.jumps++;
    beep(player.jumps===1?440:660,.07,'triangle',.12);
  }
}
document.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); jump(); } });
cv.addEventListener('pointerdown',jump);

function hit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function loop(ts){
  const dt=Math.min(.033,lastTs?(ts-lastTs)/1000:0); lastTs=ts;
  if(running){
    dist+=speed*dt/12; speed+=dt*4; // acelera gradualmente
    spawnT-=dt; gemT-=dt;
    if(spawnT<=0){
      const o=OB[Math.random()*OB.length|0];
      obs.push({...o, x:W+40, y:GROUND-o.h+o.yOff, w:o.w, h:o.h});
      spawnT=Math.max(.55, 1.7 - speed/900) * (0.7+Math.random()*.7);
    }
    if(gemT<=0){
      const high=Math.random()<.5;
      gemsArr.push({x:W+30, y:high? GROUND-150-Math.random()*60 : GROUND-70, r:14, spin:0});
      gemT=1.4+Math.random()*2;
    }
    // física jugador
    player.vy+=1650*dt; player.y+=player.vy*dt;
    if(player.y>=GROUND-player.h){ player.y=GROUND-player.h; player.vy=0; player.jumps=0; }
    // mover mundo
    for(const o of obs)o.x-=speed*dt;
    for(const g of gemsArr){ g.x-=speed*dt; g.spin+=dt*6; }
    for(const c of clouds){ c.x-=speed*dt*.15; if(c.x<-120)c.x=W+60; }
    obs=obs.filter(o=>o.x>-80);
    gemsArr=gemsArr.filter(g=>g.x>-30);
    // colisiones gemas
    for(const g of gemsArr){
      const dx=(player.x+player.w/2)-g.x, dy=(player.y+player.h/2)-g.y;
      if(dx*dx+dy*dy<(g.r+26)**2){ g.dead=true; gems++; score_g(); }
    }
    gemsArr=gemsArr.filter(g=>!g.dead);
    // colisiones obstáculos
    if(invT>0)invT-=dt;
    else for(const o of obs){
      if(hit(player,o)){
        lives--; invT=1.2; beep(140,.35,'sawtooth',.25);
        updHud();
        if(lives<=0){ endGame(); }
        break;
      }
    }
    $('dist').innerText=dist|0;
  }
  draw(dt);
  requestAnimationFrame(loop);
}

function score_g(){ gems++; beep(880,.08,'triangle',.15); updHud(); }

function draw(dt){
  // cielo
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#151535'); g.addColorStop(1,'#2a1a4a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(const s of stars){ ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fillRect(s.x,s.y,s.r,s.r); if(running){s.x-=speed*dt*.05; if(s.x<0)s.x=W;} }
  for(const c of clouds){ ctx.font='40px serif'; ctx.globalAlpha=.5; ctx.fillText('☁️',c.x,c.y); ctx.globalAlpha=1; }
  // suelo
  ctx.fillStyle='#12122a'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='var(--primary)'; ctx.strokeStyle='#667eea'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
  // líneas de velocidad
  ctx.strokeStyle='rgba(0,242,254,.25)'; ctx.lineWidth=2;
  const off=(dist*12)%60;
  for(let x=-off;x<W;x+=60){ ctx.beginPath(); ctx.moveTo(x,GROUND+22); ctx.lineTo(x+26,GROUND+22); ctx.stroke(); }
  // gemas
  for(const gm of gemsArr){
    ctx.save(); ctx.translate(gm.x,gm.y); ctx.rotate(Math.sin(gm.spin)*.3);
    ctx.font='26px serif'; ctx.textAlign='center'; ctx.fillText('💎',0,9);
    ctx.restore();
  }
  // obstáculos
  ctx.textAlign='center';
  for(const o of obs){ ctx.font=`${Math.min(o.h,o.w)+14}px serif`; ctx.fillText(o.e,o.x+o.w/2,o.y+o.h-4); }
  // jugador (parpadea si invulnerable)
  if(!(invT>0 && (Date.now()/80|0)%2)){
    ctx.save(); ctx.translate(player.x+player.w/2,player.y+player.h/2);
    const lean=player.vy<0?-.18:player.vy>0?.12:0;
    ctx.rotate(lean);
    ctx.font='46px serif'; ctx.textAlign='center';
    ctx.fillText(running&&player.jumps===0&&((Date.now()/120|0)%2)?'🏃':'🏃‍♂️',0,16);
    ctx.restore();
  }
}
requestAnimationFrame(loop);

function endGame(){
  running=false;
  $('ovEnd').style.display='flex';
  const m=dist|0;
  const msg=m>=1500?'🤯 ¡Maratoniano galáctico!' : m>=800?'🔥 ¡Qué fondo físico!' : m>=300?'👍 ¡Buena carrera!' : '🐢 ¿Calentabas hoy?';
  $('endMsg').innerText=`Corriste ${m} m y recogiste ${gems} 💎. ${msg}`;
  if(currentUser&&m>0){
    addDoc(collection(db,"scores"),{userId:currentUser.uid, gameId:GAME_ID, score:m, timestamp:new Date()}).then(loadBest).catch(()=>{});
  }
}

function startGame(){ reset(); running=true; $('ovStart').style.display='none'; $('ovEnd').style.display='none'; beep(520,.12,'triangle',.15); }
$('btnStart').onclick=startGame; $('btnAgain').onclick=startGame;

reset();
onAuthStateChanged(auth,async u=>{ if(!u){window.location.href='../index.html';return;} currentUser=u; await loadBest(); });
</script>
</body>
</html>
