<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroides - Sergio's Arcade</title>
<link rel="stylesheet" href="arcade.css">
<style>
  .help { color:#b0b0d0; font-size:.9rem; text-align:center; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
    <div class="hud"><span>PUNTOS <b id="score">0</b></span><span>VIDAS <b id="lives">🚀🚀🚀</b></span></div>
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
        <h2>☄️ ASTEROIDES</h2>
        <p>Sobrevive y destroza los asteroides.</p>
        <button class="btn-neon" id="startBtn">▶ JUGAR</button>
    </div>
    <div class="help">⬆️/W empuje · ←→/AD girar · ESPACIO disparar (o usa los botones táctiles)</div>
    <div id="touch" style="display:none; gap:10px; margin-top:10px;">
      <button class="btn-neon" id="tL">⟲</button><button class="btn-neon" id="tR">⟳</button>
      <button class="btn-neon" id="tT">🔥</button><button class="btn-neon" id="tF">⬆</button>
    </div>
    <a class="back" href="juegos.html">← Volver al Menú</a>
</div>

<script src="arcade-lib.js"></script>
<script>
let currentUser = null;
Arcade.onReady(u=>{ currentUser=u; });

if('ontouchstart' in window)document.getElementById('touch').style.display='flex';

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=520,H=520; canvas.width=W; canvas.height=H;
const overlay=document.getElementById('overlay');
let ship,rocks,bullets,parts,score,lives,running=false,raf,keys={};

function makeRock(size){
  const a=Math.random()*Math.PI*2, edge=Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){x=Math.random()*W;y=-30}else if(edge===1){x=W+30;y=Math.random()*H}
  else if(edge===2){x=Math.random()*W;y=H+30}else{x=-30;y=Math.random()*H}
  const verts=[]; const n=8+Math.floor(Math.random()*5);
  for(let i=0;i<n;i++)verts.push({a:i/n*Math.PI*2,r:.7+Math.random()*.5});
  return {x,y,vx:(Math.random()-.5)*1.6,vy:(Math.random()-.5)*1.6,size:size||34+rnd(28),rot:0,vr:(Math.random()-.5)*.05,verts};
}
function rnd(n){return Math.random()*n}
function init(){
  ship={x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2,r:13,cool:0,inv:0};
  rocks=[]; for(let i=0;i<4;i++)rocks.push(makeRock());
  bullets=[]; parts=[]; score=0; lives=3; updateHud();
}
function updateHud(){ document.getElementById('score').innerText=score; document.getElementById('lives').innerText='🚀'.repeat(lives)||'💀'; }
document.addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='Space')e.preventDefault();});
document.addEventListener('keyup',e=>keys[e.code]=false);
const bind=(id,code)=>{const b=document.getElementById(id);
  b.addEventListener('touchstart',e=>{e.preventDefault();keys[code]=true},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();keys[code]=false},{passive:false});
  b.addEventListener('mousedown',()=>keys[code]=true); b.addEventListener('mouseup',()=>keys[code]=false);};
bind('tL','ArrowLeft');bind('tR','ArrowRight');bind('tT','Space');bind('tF','ArrowUp');

function wrap(o){ if(o.x<-o.size)o.x=W+o.size; if(o.x>W+o.size)o.x=-o.size; if(o.y<-o.size)o.y=H+o.size; if(o.y>H+o.size)o.y=-o.size; }
function boom(x,y,color,n=12){ for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:26,color}); }

function loop(){
  if(!running)return;
  // control
  if(keys['ArrowLeft']||keys['KeyA'])ship.a-=.08;
  if(keys['ArrowRight']||keys['KeyD'])ship.a+=.08;
  if(keys['ArrowUp']||keys['KeyW']){ ship.vx+=Math.cos(ship.a)*.18; ship.vy+=Math.sin(ship.a)*.18;
    if(Math.random()<.6)parts.push({x:ship.x-Math.cos(ship.a)*14,y:ship.y-Math.sin(ship.a)*14,vx:-Math.cos(ship.a)*2,vy:-Math.sin(ship.a)*2,life:14,color:'#ff9800'});}
  ship.vx*=.99; ship.vy*=.99;
  const sp=Math.hypot(ship.vx,ship.vy); if(sp>6){ship.vx*=6/sp;ship.vy*=6/sp;}
  ship.x+=ship.vx; ship.y+=ship.vy; wrap(ship);
  if(ship.inv>0)ship.inv--;
  if(keys['Space']&&ship.cool<=0){
    bullets.push({x:ship.x+Math.cos(ship.a)*16,y:ship.y+Math.sin(ship.a)*16,vx:Math.cos(ship.a)*9+ship.vx*.4,vy:Math.sin(ship.a)*9+ship.vy*.4,life:55});
    ship.cool=10;
  }
  if(ship.cool>0)ship.cool--;
  // balas
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0)bullets.splice(i,1); else wrap(b);}
  // rocas
  for(const r of rocks){ r.x+=r.vx;r.y+=r.vy;r.rot+=r.vr; wrap(r); }
  // colisión bala-roca
  outer: for(let i=rocks.length-1;i>=0;i--){
    const r=rocks[i];
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(Math.hypot(b.x-r.x,b.y-r.y)<r.size){
        bullets.splice(j,1);
        boom(r.x,r.y,'#aaa');
        score+=Math.round(60-r.size);
        const small=r.size/2;
        rocks.splice(i,1);
        if(small>12){const r1=makeRock(small),r2=makeRock(small);r1.x=r.y=r.x;r1.y=r.y;r2.x=r.x;r2.y=r.y;rocks.push(r1,r2);}
        updateHud(); continue outer;
      }
    }
  }
  // colisión nave-roca
  if(ship.inv<=0)for(const r of rocks){
    if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.size+ship.r-4){
      lives--; ship.inv=90; boom(ship.x,ship.y,'#ff5252',24); updateHud();
      ship.x=W/2;ship.y=H/2;ship.vx=0;ship.vy=0;
      if(lives<=0)return gameOver();
      break;
    }
  }
  if(rocks.length===0){score+=150;updateHud();for(let i=0;i<4+levelBonus();i++)rocks.push(makeRock());}

  // dibujo
  ctx.fillStyle='#0f0f1a'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.05)';
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
  for(let i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
  ctx.lineWidth=1.5;
  for(const r of rocks){
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);
    ctx.strokeStyle='#cfd8dc';ctx.shadowColor='#cfd8dc';ctx.shadowBlur=6;ctx.beginPath();
    r.verts.forEach((v,i)=>{const x=Math.cos(v.a)*v.r*r.size,y=Math.sin(v.a)*v.r*r.size;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.closePath();ctx.stroke();ctx.restore();ctx.shadowBlur=0;
  }
  ctx.fillStyle='#ffee58'; for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,7);ctx.fill();}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    ctx.globalAlpha=p.life/26;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,2.5,2.5);ctx.globalAlpha=1;}
  if(ship.inv%10<6){
    ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);
    ctx.strokeStyle='#00f2fe';ctx.shadowColor='#00f2fe';ctx.shadowBlur=10;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-11,-10);ctx.lineTo(-6,0);ctx.lineTo(-11,10);ctx.closePath();ctx.stroke();
    ctx.restore();ctx.shadowBlur=0;
  }
  raf=requestAnimationFrame(loop);
}
function levelBonus(){return Math.min(4,Math.floor(score/500));}
function start(){ init(); running=true; overlay.style.display='none'; loop(); }
function gameOver(){
  running=false; cancelAnimationFrame(raf);
  overlay.style.display='flex';
  overlay.querySelector('h2').innerText=`💥 DESTRUIDO — ${score} pts`;
  overlay.querySelector('p').innerText='Los asteroides ganan... por ahora.';
  document.getElementById('startBtn').innerText='🔄 REINTENTAR';
  Arcade.addScore(score);
}
document.getElementById('startBtn').addEventListener('click',start);
// pantalla inicial
ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,W,H);
</script>
</body>
</html>
