<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sopa de Letras Pro - Sergio's Arcade</title>
    <style>
        :root { --primary: #667eea; --secondary: #764ba2; --bg: #0f0c29; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        body { background: var(--bg); color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        h1 { font-size: 2rem; margin-bottom: 10px; background: linear-gradient(to right, var(--primary), #00f2fe); -webkit-background-clip: text; color: transparent; }
        .status { color: #aaa; margin-bottom: 20px; height: 20px; }
        
        /* Contenedor del juego */
        .game-container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
        
        /* Cuadrícula */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(10, 40px); 
            grid-template-rows: repeat(10, 40px); 
            gap: 4px; 
            background: rgba(255,255,255,0.05); 
            padding: 10px; 
            border-radius: 12px; 
            touch-action: none; /* Importante para móvil */
        }
        
        .cell { 
            width: 40px; height: 40px; 
            background: rgba(255,255,255,0.1); 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 1.2rem; 
            border-radius: 6px; cursor: pointer; 
            transition: 0.2s;
        }
        
        .cell.selected { background: var(--primary); color: white; transform: scale(1.1); }
        .cell.found { background: #4caf50; color: white; animation: pop 0.3s; }
        
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* Lista de palabras */
        .word-list { 
            background: rgba(255,255,255,0.05); 
            padding: 20px; 
            border-radius: 12px; 
            min-width: 200px; 
        }
        .word-list h3 { margin-bottom: 15px; color: var(--primary); }
        .word-item { 
            padding: 8px 12px; 
            margin-bottom: 8px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 6px; 
            transition: 0.3s; 
        }
        .word-item.found { text-decoration: line-through; opacity: 0.5; background: rgba(76, 175, 80, 0.2); }

        /* Botones */
        .controls { margin-top: 30px; display: flex; gap: 15px; }
        button { 
            background: linear-gradient(90deg, var(--primary), var(--secondary)); 
            border: none; padding: 12px 24px; color: white; 
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; 
        }
        a { color: #aaa; text-decoration: none; margin-top: 30px; display: inline-block; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(10, 32px); grid-template-rows: repeat(10, 32px); }
            .cell { width: 32px; height: 32px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <h1>Sopa de Letras Pro</h1>
    <div class="status" id="status">Cargando palabras de la API...</div>

    <div class="game-container">
        <div class="grid" id="grid"></div>
        <div class="word-list">
            <h3>Palabras a encontrar:</h3>
            <div id="words"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="initGame()">🔄 Nueva Partida</button>
    </div>
    <a href="juegos.html">← Volver al Menú</a>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // CONFIGURACIÓN FIREBASE
    const firebaseConfig = { apiKey: "AIzaSyBmTBMyE7Y_LgSXH1SrmEv29DLYdxkyUEw", authDomain: "compartir-textos-app.firebaseapp.com", projectId: "compartir-textos-app", storageBucket: "compartir-textos-app.firebasestorage.app", messagingSenderId: "705083380628", appId: "1:705083380628:web:ce267570e09e3ef1b27581" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;
    onAuthStateChanged(auth, (user) => { if(user) currentUser = user; else window.location.href = '../index.html'; });

    // LÓGICA DEL JUEGO
    const gridSize = 10;
    let grid = [], wordsToFind = [], foundWords = [], isSelecting = false, selectionStart = null, selectedCells = [];
    
    // API de Diccionario Español (Gratuita y abierta)
    const API_URL = "https://api.diccionarios.asmadrid.org/api/v1/words?limit=50&random=true";

    window.initGame = async function() {
        document.getElementById('status').innerText = "Obteniendo palabras...";
        foundWords = [];
        try {
            // Intentamos obtener palabras de la API
            const res = await fetch(API_URL);
            const data = await res.json();
            
            // Filtramos: solo palabras entre 4 y 8 letras, sin tildes ni ñ para simplificar la lógica básica
            let candidates = data.words.map(w => w.word.toUpperCase())
                                     .filter(w => w.length >= 4 && w.length <= 7 && /^[A-Z]+$/.test(w));
            
            // Si la API falla o devuelve pocas, usamos fallback
            if(candidates.length < 5) throw new Error("Pocas palabras");
            
            wordsToFind = candidates.slice(0, 6); // Elegimos 6 palabras
        } catch (e) {
            console.log("Usando palabras de respaldo:", e);
            wordsToFind = ["FIREBASE", "CODIGO", "JUEGO", "WEB", "HTML", "SERGIO"];
        }

        generateGrid();
        renderGrid();
        renderWordList();
        document.getElementById('status').innerText = "Selecciona las palabras arrastrando";
    }

    function generateGrid() {
        grid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(''));
        
        wordsToFind.forEach(word => {
            let placed = false;
            let attempts = 0;
            while(!placed && attempts < 100) {
                const dir = Math.random() > 0.5 ? 'H' : 'V'; // Horizontal o Vertical
                const r = Math.floor(Math.random() * gridSize);
                const c = Math.floor(Math.random() * gridSize);
                
                if(canPlace(word, r, c, dir)) {
                    place(word, r, c, dir);
                    placed = true;
                }
                attempts++;
            }
        });

        // Rellenar huecos
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for(let r=0; r<gridSize; r++) {
            for(let c=0; c<gridSize; c++) {
                if(grid[r][c] === '') grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
            }
        }
    }

    function canPlace(word, r, c, dir) {
        if(dir === 'H' && c + word.length > gridSize) return false;
        if(dir === 'V' && r + word.length > gridSize) return false;
        for(let i=0; i<word.length; i++) {
            const nr = dir === 'V' ? r+i : r;
            const nc = dir === 'H' ? c+i : c;
            if(grid[nr][nc] !== '' && grid[nr][nc] !== word[i]) return false;
        }
        return true;
    }

    function place(word, r, c, dir) {
        for(let i=0; i<word.length; i++) {
            const nr = dir === 'V' ? r+i : r;
            const nc = dir === 'H' ? c+i : c;
            grid[nr][nc] = word[i];
        }
    }

    function renderGrid() {
        const container = document.getElementById('grid');
        container.innerHTML = '';
        for(let r=0; r<gridSize; r++) {
            for(let c=0; c<gridSize; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.innerText = grid[r][c];
                
                // Eventos Ratón
                cell.onmousedown = (e) => startSelection(r, c, e);
                cell.onmouseenter = () => updateSelection(r, c);
                cell.onmouseup = endSelection;
                
                // Eventos Táctiles (Móvil)
                cell.ontouchstart = (e) => { e.preventDefault(); startSelection(r, c, e); };
                
                container.appendChild(cell);
            }
        }
        
        // Evento global para soltar fuera de la cuadrícula
        document.body.onmouseup = endSelection;
        document.body.ontouchend = endSelection;
        
        // Soporte táctil para arrastrar
        container.ontouchmove = (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            if(target && target.classList.contains('cell')) {
                updateSelection(parseInt(target.dataset.r), parseInt(target.dataset.c));
            }
        };
    }

    function renderWordList() {
        const list = document.getElementById('words');
        list.innerHTML = wordsToFind.map(w => `<div class="word-item" id="w-${w}">${w}</div>`).join('');
    }

    // Lógica de Selección
    function startSelection(r, c) {
        isSelecting = true;
        selectionStart = {r, c};
        selectedCells = [{r, c}];
        highlightCells();
    }

    function updateSelection(r, c) {
        if(!isSelecting) return;
        selectedCells = getLine(selectionStart.r, selectionStart.c, r, c);
        highlightCells();
    }

    function endSelection() {
        if(!isSelecting) return;
        isSelecting = false;
        
        const word = selectedCells.map(pos => grid[pos.r][pos.c]).join('');
        const reversed = word.split('').reverse().join('');
        
        if(wordsToFind.includes(word) && !foundWords.includes(word)) markFound(word);
        else if(wordsToFind.includes(reversed) && !foundWords.includes(reversed)) markFound(reversed);
        
        clearSelection();
    }

    function getLine(r1, c1, r2, c2) {
        const cells = [];
        const dr = r2 - r1;
        const dc = c2 - c1;
        
        // Solo permitir líneas rectas (H, V o Diagonal perfecta)
        if(dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
            const steps = Math.max(Math.abs(dr), Math.abs(dc));
            const stepR = dr === 0 ? 0 : dr / steps;
            const stepC = dc === 0 ? 0 : dc / steps;
            
            for(let i=0; i<=steps; i++) {
                cells.push({r: r1 + i*stepR, c: c1 + i*stepC});
            }
        }
        return cells;
    }

    function highlightCells() {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
        selectedCells.forEach(pos => {
            const cell = document.querySelector(`.cell[data-r="${pos.r}"][data-c="${pos.c}"]`);
            if(cell) cell.classList.add('selected');
        });
    }

    function clearSelection() {
        selectedCells = [];
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
    }

    function markFound(word) {
        foundWords.push(word);
        document.getElementById(`w-${word}`).classList.add('found');
        
        // Marcar celdas permanentemente
        // Necesitamos saber qué celdas forman esa palabra, pero como ya limpiamos selección, 
        // lo hacemos buscando en la grid (simplificación para este ejemplo)
        // En una versión pro guardaríamos las coordenadas al validar.
        
        if(foundWords.length === wordsToFind.length) {
            document.getElementById('status').innerText = "¡GANASTE! 🎉 Guardando récord...";
            saveScore();
        }
    }

    async function saveScore() {
        if(currentUser) {
            // Puntuación basada en tiempo (menor es mejor) o simplemente 1000 por ganar
            await addDoc(collection(db, "scores"), { userId: currentUser.uid, gameId: 'sopas', score: 1000, timestamp: new Date() });
        }
    }

    // Iniciar al cargar
    initGame();
</script>
</body>
</html>
