<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tetris Block - Sergio's Arcade</title>
    <style>
        body { background: #0f0c29; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
        canvas { border: 2px solid #764ba2; background: #000; box-shadow: 0 0 20px rgba(118,75,162,0.4); }
        .ui { text-align: center; margin-bottom: 15px; }
        .score { font-size: 2rem; font-weight: bold; color: #00f2fe; }
        button { background: #764ba2; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        a { color: #aaa; text-decoration: none; margin-top: 20px; display: inline-block; }
    </style>
</head>
<body>
    <div class="ui">
        <div class="score">Puntos: <span id="score">0</span></div>
        <button onclick="startGame()">▶ Iniciar / Reiniciar</button>
    </div>
    <canvas id="game" width="300" height="600"></canvas>
    <a href="juegos.html">← Volver al Menú</a>

    <script src="arcade-lib.js"></script>
        <script>

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const ROWS = 20, COLS = 10, BLOCK_SIZE = 30;
        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let score = 0, gameLoop, currentPiece, currentX, currentY;
        let level = 1, linesTotal = 0, dropMs = 500, paused = false;
        let nextIdx = Math.floor(Math.random() * SHAPES.length);   // "siguiente pieza"
        
        const SHAPES = [
            [[1,1,1,1]], // I
            [[1,1],[1,1]], // O
            [[0,1,0],[1,1,1]], // T
            [[1,0,0],[1,1,1]], // L
            [[0,0,1],[1,1,1]], // J
            [[0,1,1],[1,1,0]], // S
            [[1,1,0],[0,1,1]]  // Z
        ];
        const COLORS = ['#00f2fe', '#ffd700', '#a020f0', '#ff8c00', '#0000ff', '#00ff00', '#ff0000'];

        window.startGame = function() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            score = 0; level = 1; linesTotal = 0; dropMs = 500; paused = false;
            document.getElementById('score').innerText = score;
            spawnPiece();
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(tick, dropMs);
        }

        function tick() { if(!paused) update(); }

        function spawnPiece() {
            const idx = nextIdx;
            nextIdx = Math.floor(Math.random() * SHAPES.length);
            currentPiece = { shape: SHAPES[idx], color: COLORS[idx] };
            currentX = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
            currentY = 0;
            drawNext();
            if(collision(0, 0)) gameOver();
        }

        function drawNext() {
            ctx.fillStyle = 'rgba(255,255,255,.35)';
            ctx.font = '12px Segoe UI';
            ctx.textAlign = 'right';
            ctx.fillText('SIGUIENTE:', canvas.width - 8, 16);
            const sh = SHAPES[nextIdx];
            for(let r=0; r<sh.length; r++) for(let c=0; c<sh[r].length; c++) {
                ctx.fillStyle = sh[r][c] ? COLORS[nextIdx] : 'transparent';
                if(sh[r][c]) ctx.fillRect(canvas.width - 70 + c*14, 24 + r*14, 12, 12);
            }
            ctx.textAlign = 'left';
        }

        function update() {
            if(!collision(0, 1)) {
                currentY++;
            } else {
                merge();
                clearLines();
                spawnPiece();
            }
            draw();
        }

        function collision(dx, dy) {
            for(let r=0; r<currentPiece.shape.length; r++) {
                for(let c=0; c<currentPiece.shape[r].length; c++) {
                    if(currentPiece.shape[r][c]) {
                        const newX = currentX + c + dx;
                        const newY = currentY + r + dy;
                        if(newX < 0 || newX >= COLS || newY >= ROWS || (newY >= 0 && board[newY][newX])) return true;
                    }
                }
            }
            return false;
        }

        function merge() {
            for(let r=0; r<currentPiece.shape.length; r++) {
                for(let c=0; c<currentPiece.shape[r].length; c++) {
                    if(currentPiece.shape[r][c]) board[currentY + r][currentX + c] = currentPiece.color;
                }
            }
        }

        function clearLines() {
            for(let r=ROWS-1; r>=0; r--) {
                if(board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(Array(COLS).fill(0));
                    score += 100;
                    document.getElementById('score').innerText = score;
                    r++; 
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar tablero
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    if(board[r][c]) {
                        ctx.fillStyle = board[r][c];
                        ctx.fillRect(c*BLOCK_SIZE, r*BLOCK_SIZE, BLOCK_SIZE-2, BLOCK_SIZE-2);
                    }
                }
            }
            
            // Dibujar pieza actual
            ctx.fillStyle = currentPiece.color;
            for(let r=0; r<currentPiece.shape.length; r++) {
                for(let c=0; c<currentPiece.shape[r].length; c++) {
                    if(currentPiece.shape[r][c]) {
                        ctx.fillRect((currentX+c)*BLOCK_SIZE, (currentY+r)*BLOCK_SIZE, BLOCK_SIZE-2, BLOCK_SIZE-2);
                    }
                }
            }
        }

        function gameOver() {
            clearInterval(gameLoop);
            Arcade.beep(150, .35, 'sawtooth', .15);
            ctx.fillStyle = 'rgba(0,0,0,.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ff5252';
            ctx.font = 'bold 26px Segoe UI';
            ctx.fillText('FIN DE LA PARTIDA', canvas.width/2, canvas.height/2 - 24);
            ctx.fillStyle = '#fff';
            ctx.font = '18px Segoe UI';
            ctx.fillText('Puntos: ' + score + ' · Nivel ' + level, canvas.width/2, canvas.height/2 + 8);
            ctx.fillStyle = '#00f2fe';
            ctx.font = '14px Segoe UI';
            ctx.fillText('Pulsa ESPACIO o INICIAR para reintentar', canvas.width/2, canvas.height/2 + 40);
            ctx.textAlign = 'left';
            if (score > 0) Arcade.addScore(score);
        }

        let started = false;
        document.addEventListener('keydown', e => {
            if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
            if(e.repeat && e.key !== 'ArrowDown') return;
            if(e.key === ' ') {
                if(!started || isOver()) { startGame(); started = true; return; }
                paused = !paused;
                Arcade.toast(paused ? '⏸ PAUSA — ESPACIO para seguir' : '▶ ¡A seguir!');
                return;
            }
            if(paused) return;
            if(e.key === 'ArrowLeft' && !collision(-1, 0)) currentX++;
            if(e.key === 'ArrowRight' && !collision(1, 0)) currentX++;
            if(e.key === 'ArrowDown' && !collision(0, 1)) { currentY++; score += 1; document.getElementById('score').innerText = score; }
            if(e.key === 'ArrowUp') rotate();
            draw();
        });
        function isOver() { return !!currentPiece && collision(0, 0) && board.flat().some(Boolean) && !gameLoopActive(); }
        function gameLoopActive() { try { return gameLoop && !(typeof gameLoop === 'number' && false); } catch(e) { return false; } }

        function rotate() {
            const rotated = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(row => row[i]).reverse());
            const oldShape = currentPiece.shape;
            currentPiece.shape = rotated;
            if(collision(0, 0)) currentPiece.shape = oldShape;
        }
    </script>
</body>
</html>
