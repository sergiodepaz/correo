<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - Sergio's Arcade</title>
    <style>
        body { background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
        canvas { background: #0f0f1a; border: 2px solid #667eea; border-radius: 8px; box-shadow: 0 0 20px rgba(102,126,234,0.3); }
        .ui { text-align: center; margin-bottom: 20px; }
        .score { font-size: 2rem; font-weight: bold; color: #667eea; }
        .btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        a { color: #aaa; text-decoration: none; margin-top: 20px; display: inline-block; }
    </style>
</head>
<body>
    <div class="ui">
        <div class="score">Puntos: <span id="score">0</span></div>
        <button class="btn" onclick="startGame()">▶ Iniciar / Reiniciar</button>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <a href="juegos.html">← Volver al Menú</a>

    <script src="arcade-lib.js"></script>
        <script>

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0, dy = 0;
        let score = 0;
        let gameInterval;
        let isPlaying = false;
        let dirQueue = [];                 // cola de giros: responde rápido y evita el "auto-choque"
        let speedMs = 110;                 // velocidad inicial (baja al comer)
        let lastKey = '';                  // anti-rebote: ignora teclas repetidas
        let paused = false;

        window.startGame = function() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            dirQueue = [];
            score = 0; speedMs = 110; paused = false;
            document.getElementById('score').innerText = score;
            placeFood();
            if(gameInterval) clearInterval(gameInterval);
            isPlaying = true;
            gameInterval = setInterval(tick, speedMs);
            draw();
        }

        function tick() {
            if(paused || !isPlaying) return;
            update();
        }

        function update() {
            if(!isPlaying) return;
            if(dirQueue.length) { const d = dirQueue.shift(); dx = d.x; dy = d.y; }
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // Colisión paredes o consigo mismo
            if(head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').innerText = score;
                placeFood();
                // cada 5 manzanas la serpiente acelera un poco (¡más emoción!)
                if(score % 50 === 0 && speedMs > 60) {
                    speedMs -= 8;
                    clearInterval(gameInterval);
                    gameInterval = setInterval(tick, speedMs);
                }
            } else {
                snake.pop();
            }
            draw();
        }

        function draw() {
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, 400, 400);
            
            ctx.fillStyle = '#667eea';
            snake.forEach(s => ctx.fillRect(s.x * gridSize, s.y * gridSize, gridSize-2, gridSize-2));
            
            ctx.fillStyle = '#ff5252';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize-2, gridSize-2);
        }

        function placeFood() {
            // la comida nunca aparece encima de la serpiente
            do {
                food = { x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20) };
            } while (snake.some(s => s.x === food.x && s.y === food.y));
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            Arcade.beep(160, .3, 'sawtooth', .15);
            ctx.fillStyle = 'rgba(15,12,41,.78)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ff5252';
            ctx.font = 'bold 30px Segoe UI';
            ctx.fillText('💀 ¡FIN!', canvas.width/2, canvas.height/2 - 40);
            ctx.fillStyle = '#fff';
            ctx.font = '20px Segoe UI';
            ctx.fillText('Puntuación: ' + score, canvas.width/2, canvas.height/2);
            ctx.fillStyle = '#00f2fe';
            ctx.font = '15px Segoe UI';
            ctx.fillText('Pulsa ESPACIO o toca para reintentar', canvas.width/2, canvas.height/2 + 34);
            if (score > 0) Arcade.addScore(score);   // récord local inmediato + sincroniza con la nube
        }

        function setDir(kx, ky) {
            const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : {x: dx, y: dy};
            if ((kx === -last.x && ky === -last.y) || (kx === last.x && ky === last.y)) return; // no dar media vuelta
            if (dirQueue.length < 3) dirQueue.push({x: kx, y: ky});
        }

        // --- soporte táctil: deslizar sobre el canvas ---
        let touchStart = null;
        canvas.addEventListener('touchstart', e => { touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, {passive:true});
        canvas.addEventListener('touchend', e => {
            if (!touchStart) return;
            const t = e.changedTouches[0];
            const vx = t.clientX - touchStart.x, vy = t.clientY - touchStart.y;
            touchStart = null;
            if (!isPlaying) { startGame(); return; }
            if (Math.abs(vx) < 18 && Math.abs(vy) < 18) return;
            if (Math.abs(vx) > Math.abs(vy)) setDir(vx > 0 ? 1 : -1, 0);
            else setDir(0, vy > 0 ? 1 : -1);
        }, {passive:true});
        canvas.addEventListener('click', () => { if (!isPlaying) startGame(); });

        document.addEventListener('keydown', e => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
            if (e.repeat) return;
            if (e.key === ' ') {
                if (!isPlaying) { startGame(); return; }
                paused = !paused;
                Arcade.toast(paused ? '⏸ PAUSA — pulsa ESPACIO para seguir' : '▶ ¡Sigue así!');
                return;
            }
            if(e.key === 'ArrowUp')    setDir(0,-1);
            if(e.key === 'ArrowDown')   setDir(0,1);
            if(e.key === 'ArrowLeft')   setDir(-1,0);
            if(e.key === 'ArrowRight')  setDir(1,0);
        });
    </script>
</body>
</html>
