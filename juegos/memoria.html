<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoria Flash - Sergio's Arcade</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .info { font-size: 1.3rem; margin-bottom: 14px; color: #667eea; }
        .level-row { margin-bottom: 16px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
        .lvl-btn { background:#2a2a4e; color:#cfd6ff; border:1px solid rgba(255,255,255,.15); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:.9rem; }
        .lvl-btn.active { background:#667eea; color:#fff; }
        .grid { display: grid; gap: 10px; max-width: 560px; margin: 0 auto; }
        .card { aspect-ratio: 1; background: linear-gradient(135deg,#2a2a4e,#3a3a6e); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; transition: transform 0.3s; border: 2px solid transparent; }
        .card.flipped { background: #667eea; transform: rotateY(180deg); }
        .card.matched { background: #4caf50; border-color: #81c784; cursor: default; }
        button { background: #667eea; color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; margin-top: 20px; font-size: 1rem; }
        a { color: #aaa; text-decoration: none; margin-top: 20px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Parejas: <span id="pairsInfo">12</span> | Tiempo: <span id="timer">0</span>s | Movimientos: <span id="moves">0</span></div>
    <div class="level-row" id="levelRow">
        <button class="lvl-btn active" data-pairs="12">FÁCIL · 12 parejas</button>
        <button class="lvl-btn" data-pairs="18">MEDIA · 18 parejas</button>
        <button class="lvl-btn" data-pairs="24">DIFÍCIL · 24 parejas</button>
    </div>
    <div class="grid" id="board"></div>
    <button onclick="initGame()">🔄 Nueva Partida</button>
    <br><a href="juegos.html">← Volver al Menú</a>

    <script src="arcade-lib.js"></script>
    <script>

        // +18 parejas distintas (antes solo había 8)
        const emojis = ['🎮','🎲','🎯','🎪','🎨','🎭','🎸','🎺','🚀','🛸','🍕','🍩','🐙','🦄','🌵','⚡','🔮','🏆','🎧','🍉','🦖','🌋','🧊','🎃'];
        let pairsPerGame = 12;
        let cards = [], flipped = [], matched = 0, moves = 0, timer = 0, interval, locked = false;

        document.querySelectorAll('.lvl-btn').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll('.lvl-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            pairsPerGame = +b.dataset.pairs;
            initGame();
        }));

        window.initGame = function() {
            clearInterval(interval);
            timer = 0; moves = 0; matched = 0; flipped = []; locked = false;
            document.getElementById('timer').innerText = 0;
            document.getElementById('moves').innerText = 0;
            document.getElementById('pairsInfo').innerText = pairsPerGame;

            const chosen = [...emojis].sort(() => Math.random() - 0.5).slice(0, pairsPerGame);
            const cols = pairsPerGame <= 12 ? 6 : 8;
            const board = document.getElementById('board');
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            cards = [...chosen, ...chosen].sort(() => Math.random() - 0.5);
            board.innerHTML = '';
            
            cards.forEach((emoji, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                card.dataset.emoji = emoji;
                card.onclick = () => flipCard(card);
                board.appendChild(card);
            });

            interval = setInterval(() => {
                timer++;
                document.getElementById('timer').innerText = timer;
            }, 1000);
        }

        function flipCard(card) {
            if(locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            
            card.classList.add('flipped');
            card.innerText = card.dataset.emoji;
            flipped.push(card);

            if(flipped.length === 2) {
                moves++;
                document.getElementById('moves').innerText = moves;
                locked = true;
                
                if(flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
                    flipped.forEach(c => c.classList.add('matched'));
                    flipped = [];
                    matched += 2;
                    locked = false;
                    if(matched === cards.length) endGame();
                } else {
                    setTimeout(() => {
                        flipped.forEach(c => { c.classList.remove('flipped'); c.innerText = ''; });
                        flipped = [];
                        locked = false;
                    }, 800);
                }
            }
        }

        function endGame() {
            clearInterval(interval);
            Arcade.beep(880,.1,'triangle',.15); setTimeout(()=>Arcade.beep(1100,.1,'triangle',.15),110); setTimeout(()=>Arcade.beep(1500,.2,'triangle',.15),220);
            // Score inverso: menos tiempo y movimientos = mejor puntuación
            const score = Math.max(1000 - (timer * 2) - (moves * 5), 10);
            Arcade.endRun({ score, mensaje: `🎉 ¡Completado! ${timer}s · ${moves} movs → ${score} pts` });
        }

        initGame();
    </script>
</body>
</html>
